[project]
name = "py-config-resolver"
version = "0.1.0"
description = "Hierarchical config resolution and YAML/JSON data parsing utilities"
readme = "README.md"
authors = [
    { name = "Yurii Tereshchenko", email = "yurii.tereshchenko.w@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
config-resolver = "config_resolver.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "config_resolver"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
